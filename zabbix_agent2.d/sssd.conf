# Install in /etc/zabbix/zabbix_agent2.d/sssd.conf.
# Replace domain/user here AND in the exact-command sudoers rule.
# sssd.monitor needs a 25s item timeout (template); no timer or state file.
UserParameter=sssd.monitor,/usr/bin/sudo -n /etc/zabbix/scripts/sssd-monitor.py ipa.example.com sssd_monitor
UserParameter=sssd.service,/etc/zabbix/scripts/sssd-monitor.py --service
