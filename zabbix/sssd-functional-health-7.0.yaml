zabbix_export:
  version: '7.0'
  template_groups:
  - uuid: 71d3815f87644acfb05f729ffa72b610
    name: Templates/Applications
  templates:
  - uuid: 41cee05d1dd84aa98b2d42abfcdff09c
    template: SSSD functional health
    name: SSSD functional health
    description: |-
      Monitors identity lookup and SSHD PAM account authorization on FreeIPA/SSSD clients. Detects partial failures where sssd.service remains active but PAM account authorization fails.

      Checks:
      - SSSD service status every 30 seconds.
      - FreeIPA domain status, SSS NSS user lookup, SSHD PAM account authorization, and check latency every 60 seconds.
      - Alerts for repeated PAM/NSS failures, sustained domain offline status, domain query errors, and missing health data.
      - Optional SSSD watchdog log events, disabled by default.

      Setup:
      Install sssd-monitor.py in /etc/zabbix/scripts/ and sssd.conf in /etc/zabbix/zabbix_agent2.d/. Configure a dedicated FreeIPA monitoring account allowed by the host's SSHD HBAC rules and the matching restricted sudo rule. The JSON master item requires a 25-second timeout.

      Scope:
      Checks PAM account authorization without a password or SSH session. Does not validate password authentication, Kerberos TGTs, or a complete SSH login. Cached results do not guarantee a fresh FreeIPA connection. No automatic SSSD restart.
    groups:
    - name: Templates/Applications
    tags:
    - tag: class
      value: software
    - tag: target
      value: sssd
    - tag: target
      value: freeipa
    macros:
    - macro: '{$SSSD.WATCHDOG.LOG}'
      value: /var/log/sssd-watchdog/sssd.log
      description: Regex path for dedicated SSSD watchdog log; adapt for rotation before enabling.
    items:
    - uuid: 444e9ef3f9bb4676ab8ecddc514abe03
      name: 'SSSD: Functional health JSON'
      key: sssd.monitor
      delay: 60s
      history: 7d
      value_type: TEXT
      trends: '0'
      timeout: 25s
    - uuid: 1881de64cd7d4c5bbd4c4992c1338d77
      name: 'SSSD: Service active (30s)'
      key: sssd.service
      delay: 30s
      history: 7d
      value_type: UNSIGNED
    - uuid: 2221cfd9e7c749e2b3835d2fa29e2b2b
      name: 'SSSD: service'
      type: DEPENDENT
      key: sssd.monitor.service
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.service_up
    - uuid: 2f9f96e4e7ac436cb4c411a5342fec6f
      name: 'SSSD: domain'
      type: DEPENDENT
      key: sssd.monitor.domain
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.domain_status
      description: 1=online, 0=offline, 2=query failed/unknown. Unknown must not count as offline.
    - uuid: 75bfe7b2722e4d36bafd2fc5e57b38f7
      name: 'SSSD: domain.result'
      type: DEPENDENT
      key: sssd.monitor.domain.result
      delay: '0'
      history: 7d
      value_type: CHAR
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.domain_result
      trends: '0'
    - uuid: 1a12f1f353864befaf95e012321844f5
      name: 'SSSD: nss'
      type: DEPENDENT
      key: sssd.monitor.nss
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.nss_ok
    - uuid: bbdc4e22b7594a2fb6edda1a2435e8cc
      name: 'SSSD: pam'
      type: DEPENDENT
      key: sssd.monitor.pam
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.pam_ok
    - uuid: 49c016ee81d747628064a1dfd6b381a4
      name: 'SSSD: pam.latency'
      type: DEPENDENT
      key: sssd.monitor.pam.latency
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.pam_latency_ms
      units: ms
    - uuid: 43ca2ec5f0e54d80bb8eb0e78f2f61f1
      name: 'SSSD: timestamp'
      type: DEPENDENT
      key: sssd.monitor.timestamp
      delay: '0'
      history: 7d
      value_type: UNSIGNED
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.timestamp
    - uuid: 3ccdfeaf6efa40e9a404fe433ea49a03
      name: 'SSSD: pam.result'
      type: DEPENDENT
      key: sssd.monitor.pam.result
      delay: '0'
      history: 7d
      value_type: CHAR
      master_item:
        key: sssd.monitor
      preprocessing:
      - type: JSONPATH
        parameters:
        - $.pam_result
      trends: '0'
    - uuid: 602ee89cfdb04beb9d7df57ea24a08ce
      name: 'SSSD: Watchdog events (enable after log routing)'
      type: ZABBIX_ACTIVE
      key: logrt["{$SSSD.WATCHDOG.LOG}","was terminated by own WATCHDOG",,,skip]
      delay: 1s
      status: DISABLED
      history: 7d
      value_type: LOG
      trends: '0'
      description: Requires a dedicated, agent-readable SSSD event log and active checks. See README. Disabled until configured.
      triggers:
      - uuid: 5e41839b520448fd8d5d133752d98fbb
        expression: find(/SSSD functional health/logrt["{$SSSD.WATCHDOG.LOG}","was terminated by own WATCHDOG",,,skip],,"like","was
          terminated by own WATCHDOG")=1
        name: 'SSSD: Backend terminated by watchdog'
        priority: WARNING
        recovery_mode: NONE
        manual_close: 'YES'
        type: MULTIPLE
  triggers:
  - uuid: f93d8347f9e94014b669d00496b4df5b
    expression: nodata(/SSSD functional health/sssd.monitor,3m)=1
    name: 'SSSD: No health data for 3 minutes'
    priority: HIGH
  - uuid: 4dce4088b7364947af76d3ce24774180
    expression: last(/SSSD functional health/sssd.service)=0
    name: 'SSSD: Service is not active'
    priority: HIGH
  - uuid: 5082dc7cc93a48d6b86ea0395100b2e6
    expression: count(/SSSD functional health/sssd.monitor.pam,3m)>=2 and max(/SSSD functional health/sssd.monitor.pam,#2)=0
    name: 'SSSD: PAM account check failed in two consecutive probes'
    priority: HIGH
    dependencies:
    - name: 'SSSD: No health data for 3 minutes'
      expression: nodata(/SSSD functional health/sssd.monitor,3m)=1
    - name: 'SSSD: Service is not active'
      expression: last(/SSSD functional health/sssd.service)=0
  - uuid: 126f471dca9c4ddfa2d2b41cde923f93
    expression: count(/SSSD functional health/sssd.monitor.nss,3m)>=2 and max(/SSSD functional health/sssd.monitor.nss,#2)=0
    name: 'SSSD: SSS NSS lookup failed in two consecutive probes'
    priority: WARNING
    dependencies:
    - name: 'SSSD: No health data for 3 minutes'
      expression: nodata(/SSSD functional health/sssd.monitor,3m)=1
    - name: 'SSSD: Service is not active'
      expression: last(/SSSD functional health/sssd.service)=0
  - uuid: ed657d003d9c4829aede6742974e70f8
    expression: max(/SSSD functional health/sssd.monitor.domain,#6)=0 and count(/SSSD functional health/sssd.monitor.domain,7m)>=6
      and last(/SSSD functional health/sssd.monitor.timestamp)-last(/SSSD functional health/sssd.monitor.timestamp,#6)>=300
    name: 'SSSD: FreeIPA domain offline for at least 5 minutes'
    priority: WARNING
    dependencies:
    - name: 'SSSD: No health data for 3 minutes'
      expression: nodata(/SSSD functional health/sssd.monitor,3m)=1
    - name: 'SSSD: Service is not active'
      expression: last(/SSSD functional health/sssd.service)=0
  - uuid: a280c1c172474050a2b92b8be4f76e28
    expression: last(/SSSD functional health/sssd.monitor.domain)=2
    name: 'SSSD: Cannot determine FreeIPA domain status'
    priority: WARNING
    dependencies:
    - name: 'SSSD: No health data for 3 minutes'
      expression: nodata(/SSSD functional health/sssd.monitor,3m)=1
    - name: 'SSSD: Service is not active'
      expression: last(/SSSD functional health/sssd.service)=0
